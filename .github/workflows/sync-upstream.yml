name: Sync upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Sync fork with upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          http_code=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/merge-upstream" \
            -d '{"branch":"master"}')

          echo "HTTP status: $http_code"
          cat /tmp/resp.json
          echo

          if [ "$http_code" = "200" ]; then
            echo "Fork synced with upstream successfully."
            exit 0
          fi

          if [ "$http_code" = "409" ]; then
            echo "::warning::Upstream sync hit a conflict, resolve it manually on GitHub."
            exit 0
          fi

          echo "::error::Unexpected response: $http_code"
          exit 1
